<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BROS Planbord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232A4DD0'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='bold' font-size='13' text-anchor='middle' fill='white'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #F5F5F7;
    --surface: #FFFFFF;
    --surface-2: #F0F0F2;
    --ink: #1D1D1F;
    --ink-2: #48484A;
    --muted: #86868B;
    --line: rgba(0,0,0,.08);
    --line-2: rgba(0,0,0,.16);
    --accent: #0071E3;
    --accent-ink: #FFFFFF;
    --accent-soft: #E8F1FD;
    --ok: #2E7D4F;
    --ok-soft: #DDF0E3;
    --warn: #B8720F;
    --warn-soft: #F8EBD2;
    --crit: #B93A34;
    --crit-soft: #F7DEDC;
    --today: #D0413A;
    --weekend: rgba(27,30,28,.045);
    --shadow: 0 12px 40px rgba(0,0,0,.12);
    --card: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", ui-monospace, Menlo, "IBM Plex Mono", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E;
      --ink: #F5F5F7; --ink-2: #C7C7CC; --muted: #98989D;
      --line: rgba(255,255,255,.1); --line-2: rgba(255,255,255,.2);
      --accent: #2997FF; --accent-ink: #FFFFFF; --accent-soft: #0E2A47;
      --ok: #6FC591; --ok-soft: #1F3A2A; --warn: #E2A84C; --warn-soft: #3E2F12;
      --crit: #EF7B74; --crit-soft: #442020; --today: #F0665E;
      --weekend: rgba(255,255,255,.05); --shadow: 0 12px 40px rgba(0,0,0,.6); --card: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E;
    --ink: #F5F5F7; --ink-2: #C7C7CC; --muted: #98989D;
    --line: rgba(255,255,255,.1); --line-2: rgba(255,255,255,.2);
    --accent: #2997FF; --accent-ink: #FFFFFF; --accent-soft: #0E2A47;
    --ok: #6FC591; --ok-soft: #1F3A2A; --warn: #E2A84C; --warn-soft: #3E2F12;
    --crit: #EF7B74; --crit-soft: #442020; --today: #F0665E;
    --weekend: rgba(255,255,255,.05); --shadow: 0 12px 40px rgba(0,0,0,.6); --card: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-body); font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.02em; }
  h1 { font-size: 24px; font-weight: 700; }
  h2 { font-size: 18px; font-weight: 600; }
  h3 { font-size: 15px; font-weight: 600; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .muted { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- shell ---------- */
  .top {
    position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 80%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .top-in {
    display: flex; align-items: center; gap: 18px; padding: 10px 20px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand { align-items: center; }
  .brand .mark {
    display: inline-block; width: 66px; height: 20px; font-size: 0; color: transparent; background: var(--ink);
    -webkit-mask: url(logo-mark.svg) no-repeat center / contain; mask: url(logo-mark.svg) no-repeat center / contain;
  }
  .brand .name { font-family: var(--font-display); font-weight: 500; font-size: 15px; color: var(--muted); letter-spacing: -.01em; }
  nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    background: none; border: 0; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    color: var(--ink-2); font-weight: 500; white-space: nowrap; transition: background .15s;
  }
  nav.tabs button:hover { background: var(--surface-2); }
  nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--ground); font-weight: 600; }
  .who { display: flex; align-items: center; gap: 8px; }
  .who select { padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); }
  .banner {
    background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--line);
    padding: 8px 20px; font-size: 13px; display: none;
  }
  .banner.show { display: block; }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }

  main { padding: 20px; padding-block: 22px 60px; max-width: 1380px; margin: 0 auto; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-head .sub { color: var(--muted); margin-top: 3px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- controls ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 9px;
    border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500;
    line-height: 1.2; transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.sm { padding: 4px 8px; font-size: 12px; }
  .btn.danger { color: var(--crit); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field input, .field select, .field textarea {
    padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); width: 100%; transition: box-shadow .15s, border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .field textarea { min-height: 70px; resize: vertical; }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .form-grid .span2 { grid-column: span 2; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filters select, .filters input { padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); }

  /* ---------- surfaces ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--card); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .panel-body { padding: 14px 16px; }
  .grid { display: grid; gap: 16px; }
  .grid.kpi { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .grid.two { grid-template-columns: 1.4fr 1fr; }
  @media (max-width: 860px) { .grid.two { grid-template-columns: 1fr; } .form-grid { grid-template-columns: 1fr; } .form-grid .span2 { grid-column: auto; } }
  .kpi-tile { padding: 14px 16px; }
  .kpi-tile .v { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi-tile .v small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .kpi-tile .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .kpi-tile.crit .v { color: var(--crit); }

  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t tr.click { cursor: pointer; }
  table.t tr.click:hover td { background: var(--surface-2); }
  table.t td.r, table.t th.r { text-align: right; }
  .tw { overflow-x: auto; }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.todo { background: var(--surface-2); color: var(--ink-2); }
  .pill.busy { background: var(--accent-soft); color: var(--accent); }
  .pill.done { background: var(--ok-soft); color: var(--ok); }
  .pill.late { background: var(--crit-soft); color: var(--crit); }
  .pill.kl { background: var(--surface-2); color: var(--muted); font-weight: 500; font-size: 11px; vertical-align: middle; }
  /* schakelaar (bv. uren zichtbaar voor klant) */
  .sw { appearance: none; -webkit-appearance: none; position: relative; width: 34px; height: 20px; margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; vertical-align: middle; transition: background .15s, border-color .15s; flex: none; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: left .15s; }
  .sw:checked { background: var(--ok); border-color: var(--ok); }
  .sw:checked::after { left: 16px; }
  .field .sw, .field label.sw-row input.sw { width: 34px; height: 20px; padding: 0; border-radius: 10px; }
  .field label.sw-row { display: flex; flex-direction: row; gap: 12px; align-items: flex-start; cursor: pointer; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-weight: 400; color: var(--ink); font-size: 13px; }
  .sw-row .sw { margin-top: 1px; }
  .sw-row span { min-width: 0; }
  .pill.phase { background: var(--surface-2); color: var(--ink-2); font-weight: 500; }
  .pill.st-lopend { background: var(--accent-soft); color: var(--accent); }
  .pill.st-offerte { background: var(--warn-soft); color: var(--warn); }
  .pill.st-afgerond { background: var(--ok-soft); color: var(--ok); }
  .pill.st-on_hold { background: var(--surface-2); color: var(--muted); }
  .avatar { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 11px; font-weight: 700; color: #fff; letter-spacing: .02em; flex: none; }
  .avatars { display: inline-flex; gap: 4px; align-items: center; }
  .who-cell { display: inline-flex; align-items: center; gap: 8px; }

  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar > i.over { background: var(--crit); }
  .bar > i.done { background: var(--ok); }

  .task-check { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .row-title { font-weight: 500; }
  .row-title small { display: block; color: var(--muted); font-weight: 400; }
  a.btn { color: inherit; text-decoration: none; }
  .drive-ico { text-decoration: none; font-size: 13px; margin-left: 4px; opacity: .6; }
  .drive-ico:hover { opacity: 1; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--ink); margin-bottom: 4px; }

  /* ---------- project detail ---------- */
  .subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; margin-bottom: -1px; transition: color .15s; }
  .subtabs button:hover { color: var(--ink); }
  .subtabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 20px; }
  .meta .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .meta .v { margin-top: 2px; }
  .crumb { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .crumb button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }
  .docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 14px 16px; }
  .note { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .note:hover { border-color: var(--muted); }
  .note-head { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
  .note-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
  .note-body { font-size: 13px; line-height: 1.4; }
  .note-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
  .ap-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .ap-row input, .ap-row select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 0; width: auto; }
  .field .ap-row input:not([type=date]) { flex: 2 1 0; width: auto; }
  .field .ap-row select { flex: 1 1 0; width: auto; max-width: 180px; }
  .field .ap-row input[type=date] { flex: 0 0 150px; width: 150px; }
  .subtabs .cnt { display: inline-block; min-width: 16px; padding: 0 5px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; text-align: center; margin-left: 2px; }
  /* werfopvolging */
  .pill.vs-open { background: var(--accent-soft); color: var(--accent); }
  .pill.vs-opgelost { background: var(--warn-soft); color: var(--warn); }
  .pill.vs-gecontroleerd { background: var(--ok-soft); color: var(--ok); }
  .pill.vs-vervallen { background: var(--surface-2); color: var(--muted); }
  .late-txt { color: var(--crit); font-weight: 600; }
  .vs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 14px 16px; align-items: start; }
  .vs-group { padding: 4px 0 8px; } .vs-group h4 { margin: 12px 16px 0; font-family: var(--font-display); font-size: 14px; } .vs-group .vs-grid { padding-top: 10px; }
  .vs { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; overflow: hidden; display: flex; flex-direction: column; }
  .vs:hover { border-color: var(--muted); } .vs.vs-dim { opacity: .6; }
  .vs-fotos { position: relative; aspect-ratio: 4 / 3; background: var(--surface-2); overflow: hidden; }
  .vs-fotos .vs-thumb.main { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vs-nofoto { display: grid; place-items: center; color: var(--muted); font-size: 12px; aspect-ratio: auto; height: 44px; }
  .vs-more { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 8px; }
  .vs-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .vs-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .vs-title { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.3; }
  .vs-text { font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .vs-meta { font-size: 12px; } .vs-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; font-size: 12px; } .vs-foot > span:last-child { white-space: nowrap; flex: none; }
  .vs-thumb { width: 88px; height: 66px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface-2); }
  .vs-foto-edit { display: flex; flex-wrap: wrap; gap: 8px; min-height: 24px; }
  .vs-foto-item { position: relative; display: inline-block; }
  .vs-foto-x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 11px; cursor: pointer; box-shadow: var(--card); }
  .vs-new { position: absolute; left: 4px; bottom: 4px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 6px; }
  /* assistent */
  .chat { display: flex; flex-direction: column; gap: 10px; padding: 16px; max-height: 60vh; overflow-y: auto; }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg.klant { align-self: flex-end; align-items: flex-end; } .msg.assistent { align-self: flex-start; }
  .bubble { padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; background: var(--surface-2); }
  .msg.klant .bubble { background: var(--ink); color: var(--ground); border-bottom-right-radius: 4px; } .msg.assistent .bubble { border-bottom-left-radius: 4px; }
  .msg .when { font-size: 11px; color: var(--muted); margin-top: 3px; padding: 0 4px; }
  .voorstel.urgent { border-color: var(--crit); }
  /* werfplannen */
  .plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 14px 16px; }
  .plan-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; cursor: pointer; }
  .plan-card:hover { border-color: var(--muted); }
  .plan-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; }
  .plan-name { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 10px; font-size: 13px; font-weight: 600; background: var(--surface); border-top: 1px solid var(--line); }
  .plan-wrap { position: relative; display: inline-block; max-width: 100%; line-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; cursor: crosshair; }
  .plan-wrap img { display: block; max-width: 100%; max-height: 60vh; }
  .plan-wrap.big { cursor: default; } .plan-wrap.big img { max-height: 72vh; }
  .pin { position: absolute; transform: translate(-50%, -50%); min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--crit); color: #fff; font: 700 11px/22px var(--font-mono); text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.35); border: 2px solid #fff; cursor: pointer; white-space: nowrap; z-index: 2; }
  .pin.vs-opgelost { background: var(--warn); } .pin.vs-gecontroleerd { background: var(--ok); } .pin.vs-vervallen { background: var(--muted); }
  .pin.mine { background: var(--accent); z-index: 3; } .pin.dim { opacity: .55; cursor: default; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; place-items: center; z-index: 60; cursor: zoom-out; padding: 24px; }
  .lightbox.show { display: grid; } .lightbox img { max-width: 100%; max-height: calc(100vh - 90px); border-radius: 10px; box-shadow: var(--shadow); }
  .lightbox .btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); }
  .doc-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .doc-wrap .doc { flex: 1; min-width: 0; }
  .doc-wrap.shared .doc { border-color: var(--ok); }
  .doc-wrap input.sw { flex: none; }
  .doc { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .doc .ico { width: 30px; height: 36px; border-radius: 4px; flex: none; display: grid; place-items: center; font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: #fff; }
