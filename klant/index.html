<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BROS — Klantenportaal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B1E1C'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='bold' font-size='13' text-anchor='middle' fill='white'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #F5F5F7; --surface: #FFFFFF; --surface-2: #F0F0F2;
    --ink: #1D1D1F; --ink-2: #48484A; --muted: #86868B; --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.16);
    --accent: #1D1D1F; --accent-ink: #FFFFFF; --accent-soft: #E8E8ED;
    --ok: #2E7D4F; --ok-soft: #DDF0E3; --warn: #B8720F; --warn-soft: #F8EBD2; --crit: #B93A34; --crit-soft: #F7DEDC;
    --blue: #0071E3; --blue-soft: #E8F1FD;
    --shadow: 0 12px 40px rgba(0,0,0,.12); --card: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --ink: #F5F5F7; --ink-2: #C7C7CC; --muted: #98989D;
      --line: rgba(255,255,255,.1); --line-2: rgba(255,255,255,.2); --accent: #F5F5F7; --accent-ink: #1D1D1F; --accent-soft: #2C2C2E;
      --ok: #6FC591; --ok-soft: #1F3A2A; --warn: #E2A84C; --warn-soft: #3E2F12; --crit: #EF7B74; --crit-soft: #442020;
      --blue: #2997FF; --blue-soft: #0E2A47; --shadow: 0 12px 40px rgba(0,0,0,.6); --card: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35); color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -.025em; }
  h1 { font-size: 32px; font-weight: 700; line-height: 1.15; }
  h2 { font-size: 20px; font-weight: 600; }
  h3 { font-size: 15px; font-weight: 600; }
  p { margin: 0 0 10px; }
  a { color: var(--blue); }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .r { text-align: right; }
  .c { text-align: center; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand { align-items: center; }
  .brand .mark { display: inline-block; width: 72px; height: 22px; font-size: 0; color: transparent; background: var(--ink); -webkit-mask: url(../logo-mark.svg) no-repeat center / contain; mask: url(../logo-mark.svg) no-repeat center / contain; }
  .brand .name { font-family: var(--font-display); font-weight: 500; font-size: 14px; color: var(--muted); }
  /* ---- kopbalk + navigatie ---- */
  header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--ground) 80%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1080px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
  nav.tabs { max-width: 1080px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font: inherit; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  nav.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  @media (max-width: 640px) { main { padding: 18px 14px 50px; } h1 { font-size: 24px; } .top-in { padding: 10px 14px; } .who > span { display: none; } }
  /* ---- bouwstenen ---- */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background .15s, transform .1s; }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field input { font: inherit; padding: 11px 13px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); color: var(--ink); }
  .field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent); }
  .msg { min-height: 20px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
  .msg.err { color: var(--crit); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--card); }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .panel-body { padding: 16px 18px; }
  .tw { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th { text-align: left; font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.t td.num { white-space: nowrap; }
  table.t tr.sub td { font-size: 13px; padding-top: 5px; padding-bottom: 5px; background: var(--surface-2); }
  table.t tr:last-child td { border-bottom: 0; }
  table.t tr.groep td { background: var(--surface-2); font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); padding: 6px 10px; }
  table.t tr.tot td { font-weight: 700; border-top: 2px solid var(--line-2); background: var(--surface-2); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.offerte { background: var(--warn-soft); color: var(--warn); }
  .pill.akkoord { background: var(--ok-soft); color: var(--ok); }
  .pill.meerwerk { background: var(--blue-soft); color: var(--blue); }
  .pill.minwerk { background: var(--crit-soft); color: var(--crit); }
  .pill.grijs { background: var(--surface-2); color: var(--ink-2); }
  .pill.betaald { background: var(--ok-soft); color: var(--ok); }
  .pill.verzonden { background: var(--blue-soft); color: var(--blue); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--card); }
  .kpi .k { font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .kpi .v { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin-top: 4px; letter-spacing: -.02em; }
  .empty { padding: 28px 18px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--ink); margin-bottom: 4px; }
  .stack { display: grid; gap: 16px; }
  .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  /* ---- welkom ---- */
  .hero { padding: 8px 0 22px; }
  .hero .eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); margin-bottom: 8px; }
  .hero p.lead { font-size: 16px; color: var(--ink-2); max-width: 640px; margin-top: 8px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .steps li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .steps li:last-child { border-bottom: 0; }
  .steps .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); }
  .steps li.done .n { background: var(--ok-soft); color: var(--ok); }
  .steps li.now .n { background: var(--ink); color: var(--ground); }
  .steps li.now .nm { font-weight: 700; }
  .steps li.todo { color: var(--muted); }
  .steps .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .person { display: flex; gap: 14px; align-items: flex-start; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: white; font-size: 18px; }
  .team { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .team .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .team .foto { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--surface-2); }
  .team .nofoto { width: 100%; aspect-ratio: 4/3; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 40px; color: white; }
  .team .body { padding: 14px 16px 16px; }
  .team .fn { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .team .bio { font-size: 14px; color: var(--ink-2); white-space: pre-line; }
  /* ---- planning ---- */
  .bar { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--ink); opacity: .8; }
  .bar i.done { background: var(--ok); }
  .doc { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .doc:last-child { border-bottom: 0; }
  .doc .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; font-family: var(--font-mono); color: var(--ink-2); flex: none; }
  .doc .nm { font-weight: 600; }
  .doc small { color: var(--muted); font-size: 12px; }
  /* ---- login ---- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 32px; box-shadow: var(--shadow); }
  .login h1 { font-size: 24px; margin: 6px 0 4px; }
  .login p { color: var(--ink-2); font-size: 14px; }
  /* ---- vuurwerk bij eerste bezoek ---- */
  #fx { position: fixed; inset: 0; z-index: 50; display: none; }
  #fx canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fx .wel { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  #fx .wel div { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 8vw, 84px); color: var(--ink); letter-spacing: -.02em; text-shadow: 0 2px 30px var(--ground); animation: pop .9s cubic-bezier(.2,1.2,.3,1) both; }
  #fx .wel small { display: block; font-family: var(--font-body); font-weight: 500; font-size: clamp(15px, 2.4vw, 22px); color: var(--ink-2); margin-top: 8px; animation: pop 1.2s .3s cubic-bezier(.2,1.2,.3,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.6) translateY(20px); } to { opacity: 1; transform: none; } }
  #fx.show { display: block; background: color-mix(in srgb, var(--ground) 70%, transparent); animation: fadeout 1s 4.2s forwards; }
  @keyframes fadeout { to { opacity: 0; visibility: hidden; } }
  .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; margin-left: 4px; vertical-align: 1px; }
  .notice { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 14px 18px; border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 14px; margin-bottom: 18px; }
  .panel.approve { border-color: var(--ink); }
  label.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin: 6px 0 14px; cursor: pointer; }
  label.check input { margin-top: 3px; width: 18px; height: 18px; }
  .deadline { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .deadline.soon { color: var(--crit); font-weight: 600; }
  .gk-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .gk-nee { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .field textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--ink); resize: vertical; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; box-shadow: var(--shadow); }
  .loading { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"><canvas></canvas><div class="wel"><div id="fxTxt">Welkom</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js?v=1.18.0"></script>
<script src="portaal.js?v=1.18.0"></script>
</body>
</html>
