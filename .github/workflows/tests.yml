# Bij elke push: de testdatabank opbouwen uit sql/001..N (enkel verzonnen testgegevens) en alle tests van het Planbord draaien.
# Mislukt een test, dan krijg je een rood kruisje bij de commit op GitHub (en een mail van GitHub). Welke controle faalde,
# staat bij de run onder "Annotations" (ook zichtbaar zonder in te loggen).
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers   # zelfde plaats bij installeren (als root) en testen
      PB_WORK: /tmp/pbtest
      PB_PGDATA: /var/tmp/pbtest-pg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Benodigdheden
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 xz-utils >/dev/null
          sudo systemctl stop postgresql || true
          sudo -E pip3 install --break-system-packages -q "psycopg[binary]" pyjwt pypdf openpyxl pillow playwright
          sudo -E python3 -m playwright install --with-deps chromium >/dev/null
          sudo -E python3 -c "import psycopg, jwt, pypdf, playwright; print('python ok')"
          ls /usr/lib/postgresql/16/bin/initdb
      - name: Alle tests
        run: sudo -E env "PATH=$PATH" bash tests/alles.sh
      - name: Schermafbeeldingen bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen
          path: /tmp/pbtest/shots
          if-no-files-found: ignore
