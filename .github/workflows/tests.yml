# Bij elke push: de testdatabank opbouwen uit sql/001..N (enkel verzonnen testgegevens) en alle tests van het Planbord draaien.
# Mislukt een test, dan krijg je een rood kruisje bij de commit op GitHub (en een mail van GitHub).
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Benodigdheden
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 >/dev/null
          sudo systemctl stop postgresql || true
          sudo pip3 install --break-system-packages -q "psycopg[binary]" pyjwt pypdf openpyxl pillow playwright
          sudo python3 -m playwright install --with-deps chromium >/dev/null
      - name: Alle tests
        run: sudo -E env "PATH=$PATH" bash tests/alles.sh
      - name: Schermafbeeldingen bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen
          path: /tmp/pbtest/shots
          if-no-files-found: ignore
